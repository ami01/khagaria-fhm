# Environment used for the v2 re-analysis (scripts/v2). CPU only; no GPU needed.
name: khagaria-fhm-v2
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.0.2
  - pandas=2.2.3
  - scipy=1.14.1
  - rasterio=1.4.4
  - geopandas=1.1.3
  - scikit-learn=1.5.2
  - matplotlib=3.9.2
  - joblib=1.4.2
  - pip
  - pip:
      - xgboost==3.2.0
      - catboost==1.2.10
      - torch==2.6.0
      - shap==0.49.1
